<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-container">
        <div class="header">
            <h1 class="title">Rock, Paper &amp; Scissors</h1>
            <div class="score-display">
                <p class="player-score">Player: 0</p>
                <p class="computer-score">Computer: 0</p>
            </div>
        </div>
        <h2 class="invitation">Let's Play!</h2>
        <h3 class="rule">Best out of Five</h3>
    </div>
    <div class="button-container">
        <button class="btn rock" id="rock">Rock</button>
        <button class="btn paper" id="paper">Paper</button>
        <button class="btn scissors" id="scissors">Scissors</button>
    </div>
    <div class="bottom-container">
        <div class="choice-display">
            <p class="choice">Make Your Move!</p>
        </div>
    </div>
</body>
</html>
